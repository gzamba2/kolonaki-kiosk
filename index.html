<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ ΚΑΙ ΔΗΛΩΣΗ GDPR</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #appFrame{display:block;width:100%;height:100dvh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ ΚΑΙ ΔΗΛΩΣΗ GDPR"
    src="https://script.google.com/macros/s/AKfycbwU7k6AWp1xj2aYipobJgiabMiHmm24Qt92DrjOQFelwDX4JTbq2XoChrUVueU9TKv1Mg/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    (() => {
      const appFrame = document.getElementById('appFrame');

      // Permanent Kolonaki main-menu URL. This is the same pattern used by
      // the working Mediclinic kiosk: the GitHub wrapper owns navigation and
      // reloads the outer Apps Script frontend instead of navigating from the
      // nested Google form.
      const MAIN_MENU_URL =
        'https://script.google.com/macros/s/AKfycbwU7k6AWp1xj2aYipobJgiabMiHmm24Qt92DrjOQFelwDX4JTbq2XoChrUVueU9TKv1Mg/exec';

      function loadMainMenu() {
        const separator = MAIN_MENU_URL.includes('?') ? '&' : '?';
        appFrame.src =
          MAIN_MENU_URL +
          separator +
          '_kiosk=' + Date.now();
      }

      function isTrustedGoogleOrigin(origin) {
        return origin === 'https://script.google.com' ||
          origin === 'https://script.googleusercontent.com' ||
          /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(origin);
      }

      window.addEventListener('message', (event) => {
        if (!isTrustedGoogleOrigin(event.origin)) return;

        const data = event.data;

        const isNavigationMessage =
          data &&
          typeof data === 'object' &&
          data.type === 'MEDICLINIC_FORM_SUBMITTED';

        const isLegacyCancel = data === 'MEDICLINIC_FORM_CANCELLED';

        if (!isNavigationMessage && !isLegacyCancel) return;

        if (isNavigationMessage) {
          const action = String(data.action || '').toLowerCase();

          if (!['cancelled', 'cancel', 'completed', 'complete'].includes(action)) {
            return;
          }
        }

        loadMainMenu();
      });
    })();
  </script>
</body>
</html>
